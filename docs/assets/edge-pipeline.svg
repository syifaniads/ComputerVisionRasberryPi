<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Raspberry Pi edge vision pipeline</title><desc id="desc">CIFAR-10 training with MobileNetV2 is converted to TensorFlow Lite and deployed to a Raspberry Pi camera inference loop.</desc><rect width="1200" height="380" fill="#0d1117"/><style>.b{fill:#161b22;stroke:#58a6ff;stroke-width:2;rx:14}.g{fill:#161b22;stroke:#3fb950;stroke-width:2;rx:14}.o{fill:#161b22;stroke:#d29922;stroke-width:2;rx:14}.t{fill:#f0f6fc;font:600 18px system-ui,-apple-system,Segoe UI,sans-serif}.s{fill:#8b949e;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.l{stroke:#8b949e;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker></defs><text x="35" y="42" class="t">Edge vision lifecycle</text><text x="35" y="68" class="s">Retained notebook training/conversion + documented Raspberry Pi runtime</text><rect x="35" y="125" width="170" height="90" class="b"/><text x="78" y="160" class="t">CIFAR-10</text><text x="64" y="185" class="s">10k sample subset</text><rect x="255" y="105" width="210" height="130" class="b"/><text x="300" y="140" class="t">MobileNetV2</text><text x="290" y="166" class="s">ImageNet backbone</text><text x="290" y="190" class="s">frozen + Dense 128</text><text x="290" y="214" class="s">10-way softmax</text><rect x="515" y="125" width="170" height="90" class="o"/><text x="555" y="160" class="t">TFLite</text><text x="542" y="185" class="s">conversion / optimize</text><rect x="735" y="105" width="200" height="130" class="g"/><text x="775" y="140" class="t">Raspberry Pi</text><text x="775" y="166" class="s">PiCamera2 / webcam</text><text x="775" y="190" class="s">preprocess + invoke</text><text x="775" y="214" class="s">latency overlay</text><rect x="985" y="125" width="180" height="90" class="g"/><text x="1023" y="160" class="t">Prediction</text><text x="1015" y="185" class="s">label + confidence</text><path d="M205 170 H255" class="l"/><path d="M465 170 H515" class="l"/><path d="M685 170 H735" class="l"/><path d="M935 170 H985" class="l"/></svg>